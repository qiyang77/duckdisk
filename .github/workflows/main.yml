name: Release

on:
  workflow_dispatch:
    inputs:
      skip_notarization:
        description: "Build a signed release without Apple notarization"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      SKIP_NOTARIZATION: ${{ inputs.skip_notarization && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Verify README release version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          readme_version="$(sed -n "s/^## What's New in v//p" README.md | head -n 1)"
          if [[ "$readme_version" != "$package_version" ]]; then
            echo "README What's New version ($readme_version) does not match package version ($package_version)" >&2
            exit 1
          fi

      - name: Install app dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/duckdisk-developer-id.p12"
          keychain_path="$RUNNER_TEMP/duckdisk-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          rm -f "$certificate_path"
          echo "DUCKDISK_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build and sign DMG
        env:
          DUCKDISK_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          npm run release:macos
          version="$(node -p "require('./package.json').version")"
          dmg="src-tauri/target/release/bundle/dmg/DuckDisk_${version}_arm64.dmg"
          updater="src-tauri/target/release/bundle/updater/DuckDisk_${version}_arm64.app.tar.gz"
          updater_signature="$updater.sig"
          test -f "$dmg" && test -f "$updater" && test -f "$updater_signature"
          echo "DMG_PATH=$dmg" >> "$GITHUB_ENV"
          echo "UPDATER_PATH=$updater" >> "$GITHUB_ENV"
          echo "UPDATER_SIGNATURE_PATH=$updater_signature" >> "$GITHUB_ENV"

      - name: Prepare updater manifest
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Release tag $GITHUB_REF_NAME does not match package version $version" >&2
              exit 1
            fi
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$expected_tag"
          fi
          updater_name="$(basename "$UPDATER_PATH")"
          updater_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/${updater_name}"
          latest_json="src-tauri/target/release/bundle/updater/latest.json"
          signature="$(cat "$UPDATER_SIGNATURE_PATH")"
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg signature "$signature" \
            --arg url "$updater_url" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  signature: $signature,
                  url: $url
                }
              }
            }' > "$latest_json"
          jq -e '.version and .platforms["darwin-aarch64"].signature and .platforms["darwin-aarch64"].url' \
            "$latest_json" >/dev/null
          echo "UPDATER_MANIFEST_PATH=$latest_json" >> "$GITHUB_ENV"

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          install_notes_file="$(mktemp)"
          cat > "$install_notes_file" <<'NOTES'
          Installation: Download the .dmg, open it, and drag DuckDisk into Applications.

          DuckDisk is signed with a Developer ID certificate.
          NOTES
          if [[ "${SKIP_NOTARIZATION:-0}" == "1" ]]; then
            cat >> "$install_notes_file" <<'NOTES'

          This release has not been notarized by Apple. On first launch, macOS may require right-clicking the app and choosing Open. If that does not work, run: `xattr -dr com.apple.quarantine /Applications/DuckDisk.app`
          NOTES
          else
            echo "This release is notarized by Apple." >> "$install_notes_file"
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_notes_file="$(mktemp)"
            generated_notes_file="$(mktemp)"
            previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [[ -n "$previous_tag" ]]; then
              git log --format='- %s (`%h`)' \
                "$previous_tag..$GITHUB_REF_NAME" > "$generated_notes_file"
            else
              git log --format='- %s (`%h`)' \
                --max-count=20 "$GITHUB_REF_NAME" > "$generated_notes_file"
            fi
            {
              echo "## What's New in ${GITHUB_REF_NAME#v}"
              echo
              cat "$generated_notes_file"
              echo
              cat "$install_notes_file"
            } > "$release_notes_file"
            gh release create "$GITHUB_REF_NAME" \
              --title "DuckDisk $GITHUB_REF_NAME" \
              --notes-file "$release_notes_file"
          elif ! gh release view "$GITHUB_REF_NAME" --json body --jq .body | grep -Fq "Installation: Download the .dmg"; then
            release_notes_file="$(mktemp)"
            gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$release_notes_file"
            {
              echo
              cat "$install_notes_file"
            } >> "$release_notes_file"
            gh release edit "$GITHUB_REF_NAME" --notes-file "$release_notes_file"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "$DMG_PATH" \
            "$UPDATER_PATH" \
            "$UPDATER_SIGNATURE_PATH" \
            "$UPDATER_MANIFEST_PATH" \
            --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDisk-arm64-release
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.UPDATER_PATH }}
            ${{ env.UPDATER_SIGNATURE_PATH }}
            ${{ env.UPDATER_MANIFEST_PATH }}

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${DUCKDISK_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$DUCKDISK_SIGNING_KEYCHAIN" || true
          fi
