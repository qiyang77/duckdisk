name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install app dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/duckdisk-developer-id.p12"
          keychain_path="$RUNNER_TEMP/duckdisk-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          rm -f "$certificate_path"
          echo "DUCKDISK_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize DMG
        env:
          DUCKDISK_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm run release:macos
          version="$(node -p "require('./package.json').version")"
          dmg="src-tauri/target/release/bundle/dmg/DuckDisk_${version}_arm64.dmg"
          test -f "$dmg"
          echo "DMG_PATH=$dmg" >> "$GITHUB_ENV"

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          install_notes_file="$(mktemp)"
          cat > "$install_notes_file" <<'NOTES'
          Installation: Download the .dmg, open it, and drag DuckDisk into Applications.

          DuckDisk is signed with a Developer ID certificate and notarized by Apple.
          NOTES
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_notes_file="$(mktemp)"
            {
              echo "DuckDisk macOS arm64 build."
              echo
              cat "$install_notes_file"
            } > "$release_notes_file"
            gh release create "$GITHUB_REF_NAME" \
              --title "DuckDisk $GITHUB_REF_NAME" \
              --notes-file "$release_notes_file"
          elif ! gh release view "$GITHUB_REF_NAME" --json body --jq .body | grep -Fq "Installation: Download the .dmg"; then
            release_notes_file="$(mktemp)"
            gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$release_notes_file"
            {
              echo
              cat "$install_notes_file"
            } >> "$release_notes_file"
            gh release edit "$GITHUB_REF_NAME" --notes-file "$release_notes_file"
          fi
          gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDisk-arm64-dmg
          path: ${{ env.DMG_PATH }}

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${DUCKDISK_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$DUCKDISK_SIGNING_KEYCHAIN" || true
          fi
