[package]
name = "duckdisk-tauri"
version = "0.5.9"
description = "A Tauri App"
authors = ["Qi Yang <qiyang577@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/qiyang77/duckdisk"
edition = "2021"
rust-version = "1.65"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
semver = "1"
regex = "1"
once_cell = "1"
tauri = { version = "1.8.3", features = ["dialog-ask", "dialog-open", "process-command-api", "shell-open", "window-close", "window-maximize", "window-minimize", "window-start-dragging", "window-unmaximize"] }
sysinfo = "0.27.7"
oauth2 = { version = "5.0", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
url = "2"
base64 = { version = "0.22", optional = true }
ssh2 = { version = "0.9.6", optional = true, features = ["vendored-openssl"] }

[target."cfg(target_os = \"macos\")".dependencies]
objc = { version = "0.2", optional = true }
keyring = { version = "2.3.3", default-features = false, features = ["platform-macos"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol", "direct"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
direct = ["google-drive"]
google-drive = []
mas = ["dep:base64", "dep:ssh2", "dep:objc"]
