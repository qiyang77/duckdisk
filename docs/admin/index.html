<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>DuckDisk Admin</title>
    <link rel="icon" href="/assets/duckdisk-icon.png" />
    <link rel="stylesheet" href="/admin/vendor/leaflet.css?v=1.9.4" />
    <link rel="stylesheet" href="/admin/styles.css?v=20260917a" />
  </head>
  <body>
    <main class="admin-shell">
      <section class="login-view" id="login-view">
        <form class="login-card" id="login-form">
          <a class="brand" href="/" aria-label="DuckDisk 首页">
            <span class="brand-mark" aria-hidden="true">
              <img src="/assets/duckdisk-icon.png" alt="" />
            </span>
            <span>
              <strong>DuckDisk</strong>
              <small>Admin Console</small>
            </span>
          </a>
          <div class="login-copy">
            <p>网站访问统计</p>
          </div>
          <label>
            <span>管理员邮箱</span>
            <input id="email" name="email" type="email" autocomplete="username" value="admin@duckdisk.com" required />
          </label>
          <label>
            <span>密码</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">登录</button>
          <p class="form-message" id="login-message" role="status"></p>
        </form>
      </section>

      <section class="dashboard-view" id="dashboard-view" hidden>
        <header class="dashboard-header">
          <a class="brand" href="/" aria-label="DuckDisk 首页">
            <span class="brand-mark" aria-hidden="true">
              <img src="/assets/duckdisk-icon.png" alt="" />
            </span>
            <span>
              <strong>DuckDisk</strong>
              <small>Visit Tracker</small>
            </span>
          </a>
          <div class="dashboard-actions">
            <select id="range-select" aria-label="统计时间范围">
              <option value="7">7 天</option>
              <option value="31" selected>31 天</option>
              <option value="90">90 天</option>
            </select>
            <button id="refresh-button" type="button">刷新</button>
            <button id="logout-button" type="button">退出</button>
          </div>
        </header>

        <p id="dashboard-message" class="form-message" role="status"></p>
        <section class="metric-grid" aria-label="访问概览">
          <article>
            <span>浏览量</span>
            <strong id="metric-pageviews">0</strong>
          </article>
          <article>
            <span>访客数（按日估算）</span>
            <strong id="metric-visitors">0</strong>
          </article>
          <article>
            <span>国家 / 地区</span>
            <strong id="metric-regions">0</strong>
          </article>
          <article>
            <span>统计范围 · UTC</span>
            <strong id="metric-range">-</strong>
          </article>
        </section>

        <p class="data-note">仅统计启用后的真实访问，保留 90 天。访客数按每日匿名标识估算；地图为 IP 近似位置。<span id="updated-at"></span></p>
        <section class="map-section">
          <div id="visit-map" class="visit-map" aria-label="访客位置地图"></div>
          <aside class="side-panel">
            <div>
              <h2>热门地区</h2>
              <ol class="rank-list" id="country-list"></ol>
            </div>
            <div>
              <h2>热门页面</h2>
              <ol class="rank-list" id="page-list"></ol>
            </div>
          <p class="data-note">地图位置由 IP 推测，不代表精确地址。<br>IP Geolocation by <a href="https://db-ip.com" target="_blank" rel="noopener noreferrer">DB-IP</a></p></aside>
        </section>

        <section class="table-section">
          <div class="section-title">
            <h2>最近访问</h2>
            <p id="table-note">显示最近 300 条访问记录</p>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>时间</th>
                  <th>页面</th>
                  <th>位置</th>
                  <th>IP（已脱敏）</th>
                  <th>设备</th>
                  <th>来源</th>
                </tr>
              </thead>
              <tbody id="visit-table"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
    <script src="/admin/vendor/leaflet.js?v=1.9.4"></script>
    <script src="/admin/admin.js?v=20260917a"></script>
  </body>
</html>
